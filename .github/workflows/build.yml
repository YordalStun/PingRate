name: Build Windows exe
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -r requirements.txt
      - run: python -m pytest -q tests
      - run: ./build.bat
        shell: cmd
      - name: Smoke-test the echo server exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PingRateEchoServer.exe -PassThru
          Start-Sleep 3
          if ($p.HasExited) { throw "echo server exe exited immediately" }
          Stop-Process $p
      - name: Smoke-test the app exe starts (demo mode, offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          APPDATA: ${{ runner.temp }}
        run: |
          $p = Start-Process -FilePath dist\PingRate.exe -ArgumentList "--demo" -PassThru
          Start-Sleep 12
          if ($p.HasExited) { throw "PingRate.exe exited early (exit code $($p.ExitCode))" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: PingRate-windows
          path: |
            dist/PingRate.exe
            dist/PingRateEchoServer.exe
      - name: Publish download link (release "latest-build")
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag 2>$null
          gh release create latest-build dist/PingRate.exe dist/PingRateEchoServer.exe --prerelease `
            --title "Latest build" --notes "Automatic build of ${{ github.sha }} (branch ${{ github.ref_name }})"
